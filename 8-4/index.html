<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Ideas · Homework 8.4</title>
<style>
:root{
  --violet:#6C3CE9;--violet-deep:#3B1C8C;--ink:#1B1530;--ink-2:#4A4263;
  --lav:#F4EFFF;--lav-2:#E7DDFF;--lav-3:#CDB9FF;
  --coral:#FF7A59;--coral-deep:#D9502F;--coral-soft:#FFE3DA;
  --mint:#22B8A0;--mint-deep:#128571;--mint-soft:#D6F5EF;
  --sun:#FFC93C;--sun-soft:#FFF2CC;
  --display:system-ui,-apple-system,'Segoe UI',sans-serif;--body:system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px;--ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--lav);font-size:17px;line-height:1.45;font-weight:700}
::selection{background:var(--sun)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 18px calc(18px + env(safe-area-inset-bottom))}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:18px 0 10px;position:sticky;top:0;background:var(--lav);z-index:5}
.bar{flex:1;height:14px;background:var(--lav-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--violet);border-radius:99px;transition:width .6s var(--ease);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.part{font:800 13px var(--body);color:var(--violet);white-space:nowrap}
.hidden{display:none!important}
main{flex:1;display:flex;flex-direction:column}
h1{font-family:var(--display);font-weight:800;letter-spacing:-0.025em;line-height:1.02}
h2{font-family:var(--display);font-weight:800;letter-spacing:-0.02em;font-size:25px;line-height:1.12;margin:6px 0 14px;color:var(--violet-deep)}
.muted{color:var(--ink-2);font-weight:700}
/* buttons */
.btn{display:block;width:100%;padding:16px 20px;border-radius:var(--r);font:900 17px var(--body);letter-spacing:.02em;text-transform:uppercase;background:var(--violet);color:#fff;box-shadow:0 4px 0 var(--violet-deep);transition:transform .12s,box-shadow .12s,background .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--violet-deep)}
.btn[disabled]{background:#DAD3EA;color:#8C84A3;box-shadow:0 4px 0 #C4BCD8;cursor:not-allowed}
.btn.ok{background:var(--mint);box-shadow:0 4px 0 var(--mint-deep)}
.btn.no{background:var(--coral);box-shadow:0 4px 0 var(--coral-deep)}
.foot{padding-top:16px;margin-top:auto}
/* welcome */
.hero{border-radius:24px;overflow:hidden;margin:6px 0 18px;box-shadow:0 18px 40px -20px rgba(59,28,140,.6);background:#fff}
.hero img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.welcome h1{font-size:40px;color:var(--violet-deep)}
.welcome h1 em{font-style:normal;color:var(--coral)}
.welcome p{margin:8px 0 18px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.name{padding:14px 12px;border-radius:14px;background:#fff;border:2px solid var(--lav-2);font-weight:800;text-align:left;box-shadow:0 3px 0 var(--lav-2);transition:border-color .2s,background .2s}
.name.sel{border-color:var(--violet);background:var(--lav-2);box-shadow:0 3px 0 var(--violet)}
.other{width:100%;padding:14px;border-radius:14px;border:2px solid var(--lav-3);font:800 17px var(--body);margin-bottom:6px;background:#fff;color:var(--ink)}
/* question card */
.pic{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 14px 34px -18px rgba(59,28,140,.55);margin-bottom:16px}
.pic img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;max-height:42vh}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:15px 12px;border-radius:14px;background:#fff;border:2px solid var(--lav-2);box-shadow:0 3px 0 var(--lav-2);font-weight:800;font-size:16.5px;min-height:62px;transition:border-color .15s,background .15s}
.opt.sel{border-color:var(--violet);background:var(--lav-2);box-shadow:0 3px 0 var(--violet)}
.opt.right{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 3px 0 var(--mint)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 3px 0 var(--coral)}
/* spelling */
.phrase{text-align:center;font:800 20px var(--body);margin:0 0 12px;color:var(--ink-2)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:18px}
.slot{width:38px;height:46px;border-radius:10px;background:#fff;border:2px solid var(--lav-3);display:flex;align-items:center;justify-content:center;font:800 24px var(--display);color:var(--violet-deep);text-transform:lowercase;transition:transform .2s var(--ease),border-color .2s}
.slot.filled{border-color:var(--violet);transform:translateY(-2px)}
.slots.right .slot{border-color:var(--mint);background:var(--mint-soft)}
.slots.wrong .slot{border-color:var(--coral);background:var(--coral-soft)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:46px;height:50px;border-radius:12px;background:#fff;border:2px solid var(--lav-2);box-shadow:0 4px 0 var(--lav-3);font:800 24px var(--display);color:var(--ink);text-transform:lowercase;transition:transform .12s,opacity .2s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lav-3)}
.tile.used{opacity:.18;pointer-events:none;box-shadow:none}
/* match */
.pairs{display:grid;grid-template-columns:1fr 1.35fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px}
.pr{padding:12px;border-radius:14px;background:#fff;border:2px solid var(--lav-2);box-shadow:0 3px 0 var(--lav-2);font-weight:800;font-size:15px;text-align:left;min-height:58px;transition:all .2s}
.pr.sel{border-color:var(--violet);background:var(--lav-2)}
.pr.done{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-deep);box-shadow:none;pointer-events:none;opacity:.75}
.pr.shake{animation:shake .35s;border-color:var(--coral);background:var(--coral-soft)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* type */
.sent{background:#fff;border-radius:20px;padding:22px 20px;font-size:21px;line-height:1.7;box-shadow:0 14px 34px -20px rgba(59,28,140,.5);margin-bottom:14px}
.sent input{font:800 21px var(--body);color:var(--violet-deep);border:0;border-bottom:3px solid var(--violet);width:9ch;padding:0 4px;background:var(--lav);border-radius:6px 6px 0 0}
.sent input.right{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-deep)}
.sent input.wrong{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-deep)}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;margin-bottom:14px}
/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s var(--ease);z-index:20}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.sheet.good{background:var(--mint-soft)}.sheet.bad{background:var(--coral-soft)}
.sheet h3{font:800 22px var(--display);margin-bottom:4px}
.sheet.good h3{color:var(--mint-deep)}.sheet.bad h3{color:var(--coral-deep)}
.sheet p{margin-bottom:14px;font-weight:800}
/* intro cards */
.intro{text-align:left;padding-top:10vh}
.intro .tag{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:20px;background:var(--violet);color:#fff;font:800 30px var(--display);margin-bottom:18px;box-shadow:0 6px 0 var(--violet-deep)}
.intro h1{font-size:34px;color:var(--violet-deep);margin-bottom:10px}
/* result */
.score{font:800 72px var(--display);color:var(--violet);letter-spacing:-0.04em;line-height:1}
.score small{font-size:30px;color:var(--ink-2)}
.rows{margin:18px 0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;background:#fff;border-radius:14px;padding:13px 16px}
.row b{font-family:var(--display);color:var(--violet-deep)}
.status{margin-top:12px;text-align:center;font-weight:800;color:var(--ink-2);min-height:24px}
.status.err{color:var(--coral-deep)}
/* mission */
.mission h1{font-size:36px;color:var(--violet-deep);margin:4px 0 8px}
.mission h1 em{font-style:normal;color:var(--coral)}
.block{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 10px 26px -20px rgba(59,28,140,.6)}
.block h3{font:800 19px var(--display);color:var(--violet-deep);margin-bottom:8px}
.block p,.block li{font-size:16px;font-weight:700}
.block ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.check{display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--violet);flex:none;margin-top:1px}
.ru{display:block;color:var(--ink-2);font-size:13.5px;font-weight:700;margin-top:2px}
.phr{display:flex;flex-wrap:wrap;gap:8px}
.phr span{background:var(--sun-soft);border-radius:99px;padding:6px 12px;font-size:14.5px;font-weight:800}
.model{background:var(--lav);border-radius:14px;padding:14px;font-size:15.5px;line-height:1.6}
.model mark{background:transparent;color:inherit;transition:background .3s}
.model.reveal mark{background:var(--coral-soft);color:var(--coral-deep);border-radius:4px}
.link{color:var(--violet);font-weight:900;text-decoration:underline;text-underline-offset:3px;margin-top:10px;display:inline-block}
.dark{background:var(--violet-deep);color:#fff}
.dark h3{color:var(--sun)}
.fade{animation:fade .5s var(--ease)}
@keyframes fade{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top hidden" id="top"><div class="bar"><i id="bar"></i></div><span class="part" id="partLbl"></span></div>
  <main id="main"></main>
</div>
<div class="sheet" id="sheet"><div class="in"><h3 id="shT"></h3><p id="shP"></p><button class="btn" id="shB">Continue</button></div></div>

<script>
const IMG = {"light_bulb": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260922_213702_5bb3156e-ff98-4aa1-8e02-f9bac1328b42_min.webp", "drone": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260922_213701_43f182b1-51d8-4a46-a3c3-1d88a03021e8_min.webp", "vaccine": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260922_213736_7ca3b499-50ea-48bb-9e65-6f5a400c5603_min.webp", "printer": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260922_213736_e6fddab9-ab7c-4edc-8d2c-9d7746f30cab_min.webp", "laptop": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065255_bd56bcb0-1d2f-4ddf-88cf-041f09905afa_min.webp", "fridge": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065255_59c5c41c-5a75-4720-93ee-6c157d658269_min.webp", "electric_car": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065326_0b8ffc63-e037-413c-8d99-99e6650ed31b_min.webp", "satnav": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065326_141f32ea-1ff1-4d49-ae00-e413fff9f24c_min.webp", "smartphone": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065352_21914f49-6bed-4a2c-85d2-f0a50406618f_min.webp", "tablet": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065352_bd21e12c-4471-4882-bc31-ad354eff7e87_min.webp", "keyboard": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065451_421c6ad2-ed2e-4119-a043-f0e05d5ed7f0_min.webp", "screen": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065451_a01abcfa-70c2-45ae-a69f-8527208e233e_min.webp", "mouse": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065639_e7fbf200-e476-4943-91c6-5c701cab726d_min.webp", "earphones": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065640_28e11296-3447-467a-ada3-694d51ceaf93_min.webp", "microwave": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065838_a1f3f506-9b94-4ae6-af2d-8b016cbd58d3_min.webp", "camera": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_065839_bbbec76d-8769-4766-b371-443eedf5542a_min.webp", "engineer": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_070021_0d77406a-2e4e-4ce2-9569-002c20a64ff5_min.webp", "experiment": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_070021_365838e8-a779-4228-8c56-92b17d18ca14_min.webp", "cover": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_070049_35d6b838-c734-4d79-b833-504f4fc3ec9e_min.webp", "minjun": "https://d8j0ntlcm91z4.cloudfront.net/user_3JKlXZkTMYc1gyxXMWBxlW61PY0/hf_20260923_070049_92f4d85b-c369-4ede-8c2d-feef94008b50_min.webp"};
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbx9CUvXuQ827FfwviQ0JxtdBl7_K7Jg54c-O9g4EmVjGiJwlK8shWJtrz1yOXHpkd5V4g/exec'; // Apps Script /exec URL (empty = send via Telegram share)
const STUDENTS = ["Пономарев Вова","Соцкий Федя","Дмитренко Иван","Егармин Слава","Савельев Андрей","Дугинец Свят"];

/* ---------- tasks (keys are re-checked on the server) ---------- */
const MC = [
  {img:'light_bulb', a:'a light bulb', f:'If you switch it on, the light bulb gives you light.', o:['a light bulb','a camera','a printer','a screen']},
  {img:'drone', a:'a drone', f:'If you fly a drone, you can film from the sky.', o:['a drone','a satnav','a vaccine','a mouse']},
  {img:'vaccine', a:'a vaccine', f:'If you have a vaccine, you don\'t get the illness.', o:['a vaccine','a microwave','a fridge','a tablet']},
  {img:'printer', a:'a printer', f:'If you press print, the printer makes a paper copy.', o:['a laptop','a printer','a keyboard','a drone']},
  {img:'laptop', a:'a laptop', f:'If you take a laptop with you, you can work anywhere.', o:['a screen','a fridge','a laptop','a satnav']},
  {img:'fridge', a:'a fridge', f:'If you put food in the fridge, it stays fresh longer.', o:['a microwave','a fridge','a printer','a camera']},
  {img:'satnav', a:'a satnav', f:'If you use a satnav, you don\'t get lost.', o:['a satnav','a tablet','a mouse','an electric car']},
  {img:'electric_car', a:'an electric car', f:'If you drive an electric car, you don\'t use petrol.', o:['an electric car','a drone','a laptop','a fridge']}
];
const SP = [
  {img:'smartphone', pre:'a', w:'smartphone', x:'ei'},
  {img:'tablet', pre:'a', w:'tablet', x:'ro'},
  {img:'keyboard', pre:'a', w:'keyboard', x:'ns'},
  {img:'screen', pre:'a', w:'screen', x:'ad'},
  {img:'mouse', pre:'a computer', w:'mouse', x:'rt'},
  {img:'earphones', pre:'a pair of', w:'earphones', x:'it'},
  {img:'microwave', pre:'a', w:'microwave', x:'ls'},
  {img:'camera', pre:'a digital', w:'camera', x:'up'}
];
const PAIRS = [
  ['design','to plan how something will look before you make it'],
  ['invent','to make something completely new for the first time'],
  ['discover','to find something that was always there'],
  ['develop','to make something better, step by step'],
  ['produce','to make something in large numbers'],
  ['build','to make a house, a bridge or a machine from parts']
];
const TY = [
  {s:'A doctor gives you a ___ so you don\'t get ill.', h:'v', a:'vaccine', img:'vaccine'},
  {s:'If you put a grape in a ___, it explodes.', h:'m', a:'microwave', img:'microwave'},
  {s:'Mark Rober is an ___: he designs and builds machines.', h:'e', a:'engineer', img:'engineer'},
  {s:'A ___ tells you which way to drive.', h:'s', a:'satnav', img:'satnav'},
  {s:'Scientists do an ___ to test an idea.', h:'e', a:'experiment', img:'experiment'},
  {s:'Edison is famous for the light ___.', h:'b', a:'bulb', img:'light_bulb'}
];

const TOTAL_STEPS = MC.length + SP.length + 1 + TY.length;
const S = {name:'', t0:0, step:0, mc:[], sp:[], pairsMistakes:0, ty:[]};
const $ = s => document.querySelector(s);
const main = $('#main');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');

function progress(label){
  $('#top').classList.remove('hidden');
  $('#bar').style.width = Math.round(S.step / TOTAL_STEPS * 100) + '%';
  $('#partLbl').textContent = label;
}
function view(html){ main.innerHTML = '<div class="fade" style="display:flex;flex-direction:column;flex:1">'+html+'</div>'; window.scrollTo(0,0); }
function sheet(good, title, text, next){
  const sh = $('#sheet');
  sh.className = 'sheet show ' + (good ? 'good' : 'bad');
  $('#shT').textContent = title; $('#shP').innerHTML = text || '';
  const b = $('#shB'); b.className = 'btn ' + (good ? 'ok' : 'no');
  b.onclick = () => { sh.className = 'sheet'; next(); };
  setTimeout(()=>b.focus(), 50);
}
const PRAISE = ['Great!','Nice one!','Perfect!','Well done!','Yes!','Brilliant!'];
const praise = () => PRAISE[Math.floor(Math.random()*PRAISE.length)];

/* ---------- welcome ---------- */
function welcome(){
  view(`
    <section class="welcome">
      <div class="hero"><img src="${IMG.cover}" alt=""></div>
      <h1>Big Ideas <em>What if…?</em></h1>
      <p class="muted">Homework · Gateway A2, Unit 10 · группа 8.4. About 15 minutes. At the end you get your Speaking Mission.</p>
      <h2>Who are you?</h2>
      <div class="names">${STUDENTS.map(n=>`<button class="name" data-n="${esc(n)}">${esc(n)}</button>`).join('')}<button class="name" data-n="__other">Другой</button></div>
      <input class="other hidden" id="other" placeholder="Имя и фамилия" autocomplete="name">
    </section>
    <div class="foot"><button class="btn" id="go" disabled>Start</button></div>`);
  const go = $('#go'), other = $('#other');
  main.querySelectorAll('.name').forEach(b => b.onclick = () => {
    main.querySelectorAll('.name').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    if (b.dataset.n === '__other'){ other.classList.remove('hidden'); other.focus(); S.name=''; go.disabled = !other.value.trim(); }
    else { other.classList.add('hidden'); S.name = b.dataset.n; go.disabled = false; }
  });
  other.oninput = () => { S.name = other.value.trim(); go.disabled = !S.name; };
  go.onclick = () => { S.t0 = Date.now(); trackOpen(); intro(1,'Inventions quiz','What is it? Look at the picture and choose the right invention.', ()=>mc(0)); };
}
function trackOpen(){
  fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({event:'opened',assignmentId:'a_u10_8_4',unit:'u10',name:S.name})}).catch(()=>{});
}
function intro(n, title, text, next){
  $('#top').classList.add('hidden');
  view(`<section class="intro"><span class="tag">${n}</span><h1>${title}</h1><p class="muted">${text}</p></section><div class="foot"><button class="btn" id="n">Let's go</button></div>`);
  $('#n').onclick = next;
}

/* ---------- part 1: picture multiple choice ---------- */
function mc(i){
  if (i >= MC.length) return intro(2,'Spelling game','Look at the picture. Tap the letters in the right order. There are two extra letters!', ()=>sp(0));
  progress('Part 1 · ' + (i+1) + '/' + MC.length);
  const q = MC[i], opts = shuffle(q.o);
  view(`<h2>What is it?</h2><div class="pic"><img src="${IMG[q.img]}" alt=""></div>
    <div class="opts">${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div>
    <div class="foot"><button class="btn" id="chk" disabled>Check</button></div>`);
  let pick = null;
  const bs = main.querySelectorAll('.opt');
  bs.forEach(b => b.onclick = () => { bs.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); pick = b.textContent; $('#chk').disabled = false; });
  $('#chk').onclick = () => {
    S.mc[i] = pick; S.step++;
    const ok = pick === q.a;
    bs.forEach(b => { b.disabled = true; if (b.textContent === q.a) b.classList.add('right'); else if (b.textContent === pick) b.classList.add('wrong'); });
    $('#chk').classList.add('hidden');
    sheet(ok, ok ? praise() : 'Not quite', (ok ? '' : 'Correct answer: <b>' + esc(q.a) + '</b><br>') + esc(q.f), () => mc(i+1));
  };
}

/* ---------- part 2: spelling with letter tiles ---------- */
function sp(i){
  if (i >= SP.length) return intro(3,'Verbs and words from the unit','First match the pairs, then write the missing words.', pairs);
  progress('Part 2 · ' + (i+1) + '/' + SP.length);
  const q = SP[i], letters = shuffle((q.w + q.x).split(''));
  view(`<h2>Spell the word</h2><div class="pic"><img src="${IMG[q.img]}" alt=""></div>
    <p class="phrase">${esc(q.pre)} <span style="color:var(--violet)">…</span> ${q.post?esc(q.post):''}</p>
    <div class="slots" id="slots">${q.w.split('').map(()=>'<div class="slot"></div>').join('')}</div>
    <div class="tiles" id="tiles">${letters.map((l,k)=>`<button class="tile" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="foot"><button class="btn" id="chk" disabled>Check</button></div>`);
  const slots = [...main.querySelectorAll('.slot')], tiles = [...main.querySelectorAll('.tile')];
  const fill = []; // tile indexes in slot order
  const draw = () => {
    slots.forEach((s,k) => { const t = fill[k]; s.textContent = t==null ? '' : letters[t]; s.classList.toggle('filled', t!=null); });
    tiles.forEach(t => t.classList.toggle('used', fill.includes(+t.dataset.k)));
    $('#chk').disabled = fill.filter(x=>x!=null).length !== q.w.length;
  };
  tiles.forEach(t => t.onclick = () => { const k = +t.dataset.k; const free = slots.findIndex((_,j)=>fill[j]==null); if (free>-1){ fill[free]=k; draw(); } });
  slots.forEach((s,j) => s.onclick = () => { if (fill[j]!=null){ fill[j]=null; draw(); } });
  $('#chk').onclick = () => {
    const word = fill.map(k=>letters[k]).join('');
    S.sp[i] = word; S.step++;
    const ok = word === q.w;
    $('#slots').classList.add(ok ? 'right' : 'wrong');
    tiles.forEach(t=>t.disabled=true); slots.forEach(s=>s.onclick=null);
    $('#chk').classList.add('hidden');
    sheet(ok, ok ? praise() : 'Almost!', ok ? '<b>' + esc(q.pre + ' ' + q.w) + '</b>' : 'It\'s spelled <b>' + esc(q.w) + '</b>. Say it: ' + esc(q.pre + ' ' + q.w), () => sp(i+1));
  };
}

/* ---------- part 3a: match pairs ---------- */
function pairs(){
  progress('Part 3 · pairs');
  const L = shuffle(PAIRS.map((p,k)=>({k,t:p[0]}))), R = shuffle(PAIRS.map((p,k)=>({k,t:p[1]})));
  view(`<h2>Match the pairs</h2>
    <div class="pairs"><div class="col">${L.map(x=>`<button class="pr" data-k="${x.k}" data-s="L">${esc(x.t)}</button>`).join('')}</div>
    <div class="col">${R.map(x=>`<button class="pr" data-k="${x.k}" data-s="R">${esc(x.t)}</button>`).join('')}</div></div>
    <div class="foot"><p class="muted" style="text-align:center">Tap a word, then its meaning.</p></div>`);
  let sel = {L:null, R:null}, done = 0;
  main.querySelectorAll('.pr').forEach(b => b.onclick = () => {
    const side = b.dataset.s;
    if (sel[side]) sel[side].classList.remove('sel');
    sel[side] = b; b.classList.add('sel');
    if (sel.L && sel.R){
      const a = sel.L, c = sel.R; sel = {L:null, R:null};
      if (a.dataset.k === c.dataset.k){ a.className = c.className = 'pr done'; done++;
        if (done === PAIRS.length){ S.step++; sheet(true, S.pairsMistakes === 0 ? 'All pairs, no mistakes!' : 'All matched!', 'Mistakes: ' + S.pairsMistakes, () => ty(0)); }
      } else { S.pairsMistakes++; [a,c].forEach(x=>{ x.classList.remove('sel'); x.classList.add('shake'); setTimeout(()=>x.classList.remove('shake'),400); }); }
    }
  });
}

/* ---------- part 3b: type the missing word ---------- */
function ty(i){
  if (i >= TY.length) return finish();
  progress('Part 3 · ' + (i+1) + '/' + TY.length);
  const q = TY[i];
  const field = `<input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.h}…" aria-label="missing word">`;
  const sentence = q.s.includes('___') ? esc(q.s).replace('___', field) : esc(q.s) + ' ' + field + '.';
  view(`<h2>Write the missing word</h2>${q.img?`<img class="thumb" src="${IMG[q.img]}" alt="">`:''}
    <div class="sent">${sentence}</div><p class="muted">It starts with <b style="color:var(--violet)">${q.h}</b>.</p>
    <div class="foot"><button class="btn" id="chk" disabled>Check</button></div>`);
  const inp = $('#inp'); inp.style.width = Math.max(7, q.a.length + 2) + 'ch'; setTimeout(()=>inp.focus(), 80);
  inp.oninput = () => $('#chk').disabled = !inp.value.trim();
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) $('#chk').click(); };
  $('#chk').onclick = () => {
    const v = inp.value; S.ty[i] = v; S.step++;
    const ok = norm(v) === q.a;
    inp.classList.add(ok ? 'right' : 'wrong'); inp.disabled = true;
    $('#chk').classList.add('hidden');
    sheet(ok, ok ? praise() : 'Not quite', ok ? '' : 'Correct answer: <b>' + esc(q.a) + '</b>', () => ty(i+1));
  };
}

/* ---------- finish + send ---------- */
function localScore(){
  const mc = MC.filter((q,i)=>S.mc[i]===q.a).length;
  const sp = SP.filter((q,i)=>S.sp[i]===q.w).length;
  const pr = Math.max(0, PAIRS.length - S.pairsMistakes);
  const ty = TY.filter((q,i)=>norm(S.ty[i])===q.a).length;
  return {mc, sp, pr, ty, total: mc+sp+pr+ty, max: MC.length+SP.length+PAIRS.length+TY.length};
}
function finish(){
  S.step = TOTAL_STEPS; progress('Done');
  const r = localScore();
  view(`<h2>Well done, ${esc(S.name)}!</h2>
    <div class="score">${r.total}<small> / ${r.max}</small></div>
    <div class="rows">
      <div class="row"><span>Picture quiz</span><b>${r.mc} / ${MC.length}</b></div>
      <div class="row"><span>Spelling game</span><b>${r.sp} / ${SP.length}</b></div>
      <div class="row"><span>Match the pairs</span><b>${r.pr} / ${PAIRS.length}</b></div>
      <div class="row"><span>Missing words</span><b>${r.ty} / ${TY.length}</b></div>
    </div>
    <div class="foot"><button class="btn" id="send">Next: send & get my mission</button><p class="status" id="st"></p></div>`);
  $('#send').onclick = send;
}
function report(){
  const r = localScore();
  const wrong = [];
  MC.forEach((q,i)=>{ if(S.mc[i]!==q.a) wrong.push(q.a+' → '+(S.mc[i]||'—')); });
  SP.forEach((q,i)=>{ if(S.sp[i]!==q.w) wrong.push(q.pre+' '+q.w+' → '+(S.sp[i]||'—')); });
  TY.forEach((q,i)=>{ if(norm(S.ty[i])!==q.a) wrong.push(q.a+' → '+(S.ty[i]||'—')); });
  const pct = Math.round(r.total/r.max*100);
  return ['ДЗ Gateway A2 U10 «Big Ideas» · группа 8.4', S.name, 'Итого: '+r.total+'/'+r.max+' ('+pct+'%)',
    'Картинки '+r.mc+'/8 · Спеллинг '+r.sp+'/8 · Пары '+r.pr+'/6 · Слова '+r.ty+'/6',
    wrong.length ? 'Ошибки:\n'+wrong.join('\n') : 'Без ошибок!',
    'Время: '+Math.max(1,Math.round((Date.now()-S.t0)/60000))+' мин'].join('\n');
}
function send(){
  const btn = $('#send'), st = $('#st');
  btn.disabled = true; st.className = 'status'; st.textContent = 'Sending to your teacher…';
  const payload = {assignmentId:'a_u10_8_4', unit:'u10', name:S.name, mc:S.mc, sp:S.sp, pairsMistakes:S.pairsMistakes, ty:S.ty, seconds:Math.round((Date.now()-S.t0)/1000), ua:navigator.userAgent.slice(0,120)};
  const ok = () => mission();
  const fail = e => { btn.disabled = false; btn.textContent = 'Try again'; st.className = 'status err'; st.textContent = 'Could not send. Check the internet and tap “Try again”. (' + (e && e.message ? e.message : e) + ')'; };
  if (!ENDPOINT && typeof google !== 'undefined' && google.script && google.script.run){
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail).submit(payload);
  } else if (ENDPOINT){ // file shared in the chat → Apps Script doPost → Telegram
    st.textContent = 'Sending to your teacher… (up to 10 seconds)';
    fetch(ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
      .then(ok).catch(() => shareFallback(ok)); // no-cors: the request arrives, the answer is hidden by the browser
  } else shareFallback(ok);
}
function shareFallback(ok){ // no server: the student sends the report to the teacher in Telegram
  {
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(' ') + '&text=' + encodeURIComponent(report());
    view(`<h2>Send your result to the teacher</h2>
      <p class="muted" style="margin-bottom:16px">Tap the button → Telegram opens → choose <b>your teacher</b> → Send. Then come back here for your mission.</p>
      <div class="block" style="white-space:pre-line;font-size:14.5px;background:#fff;border-radius:18px;padding:16px">${esc(report())}</div>
      <div class="foot" style="display:flex;flex-direction:column;gap:12px">
        <a class="btn" id="tg" href="${url}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Send to teacher in Telegram</a>
        <button class="btn ok" id="next" disabled>I sent it → my mission</button></div>`);
    $('#tg').onclick = () => { setTimeout(()=>{ $('#next').disabled = false; }, 1200); };
    $('#next').onclick = ok;
  }
}

/* ---------- speaking mission ---------- */
function mission(){
  $('#top').classList.add('hidden');
  view(`<section class="mission">
    <div class="hero"><img src="${IMG.minjun}" alt=""></div>
    <h1>Speaking Mission:<br><em>If… then me</em></h1>
    <p class="muted">Your results are with the teacher. Now the real homework. It is the same for everyone.</p>

    <div class="block dark"><h3>The mission</h3>
      <p>Next lesson you speak for <b>90 seconds</b>: a chain of <b>if-sentences about your own life</b>. Hide <b>ONE lie</b> inside. The class asks questions and tries to find it.</p>
      <span class="ru" style="color:var(--lav-3)">90 секунд говоришь про свою жизнь цепочкой условных предложений и прячешь в рассказе одну неправду. Класс будет искать её вопросами.</span>
    </div>

    <div class="block"><h3>Your story must have</h3>
      <div class="check">
        <label><input type="checkbox"><span>3 zero conditionals — always true about you <span class="ru">If I drink coffee at night, I don't sleep.</span></span></label>
        <label><input type="checkbox"><span>3 first conditionals — this week <span class="ru">If I finish my project on Friday, I'll go to the cinema.</span></span></label>
        <label><input type="checkbox"><span>1 sentence with <b>unless</b> <span class="ru">I won't pass the test unless I study tonight.</span></span></label>
        <label><input type="checkbox"><span>1 sentence with <b>as soon as</b> <span class="ru">As soon as I get home, I'll…</span></span></label>
        <label><input type="checkbox"><span>1 sentence with <b>might</b> <span class="ru">If the weather is good, I might go skating.</span></span></label>
        <label><input type="checkbox"><span>2 words from this unit (invention, engineer, experiment, drone, vaccine…)</span></label>
      </div>
    </div>

    <div class="block"><h3>The rule that kills the mistake</h3>
      <p>After <b>if, when, unless, as soon as</b> — <b>never</b> use <i>will</i>.<br><span style="color:var(--coral-deep)">If it will rain…</span> ✗ &nbsp; <span style="color:var(--mint-deep)">If it rains…</span> ✓</p>
    </div>

    <div class="block"><h3>How to prepare: speak, don't write</h3>
      <ol>
        <li>Say your chain out loud 3 times. You can record yourself on your phone — it's just for you.</li>
        <li>Make a card with <b>max 5 keywords</b> (no sentences!). Only this card is allowed in class.</li>
        <li>Be ready: a partner will retell two of your sentences in the 3rd person (<i>“If he misses the bus, he'll…”</i>), and the teacher will ask <b>2 surprise questions</b>.</li>
      </ol>
      <span class="ru">ИИ может написать текст, но не ответит за тебя на неожиданные вопросы учителя. Готовься говорить сам.</span>
    </div>

    <div class="block"><h3>Useful phrases</h3>
      <div class="phr"><span>If I…, I always…</span><span>If I don't…, I…</span><span>If I have time tomorrow, I'll…</span><span>I won't… unless…</span><span>As soon as I…, I'll…</span><span>I might…</span><span>That's why…</span><span>But if…</span></div>
    </div>

    <div class="block"><h3>Example (not you!): find Slava's lie</h3>
      <div class="model" id="model">If I don't have breakfast, I feel terrible by the third lesson. If my phone battery dies, I use my brother's old phone, and it's slower than a fridge. I always break something if I try to repair it — last week I opened our printer and it still doesn't work. <mark>If I go to bed after midnight, I wake up at five o'clock, full of energy.</mark> This week is busy. If I finish my project on Thursday, I'll go skating with Vova. I won't finish it unless my sister helps me. As soon as the holidays start, I'll build a drone from a kit. If the weather is good, I might test it in the park.</div>
      <button class="link" id="rev">Show the lie</button>
    </div>
    <div class="block dark"><h3>See you next lesson!</h3><p>No notes. Just you, your 5 keywords and your English.</p></div>
  </section>`);
  $('#rev').onclick = () => { $('#model').classList.toggle('reveal'); $('#rev').textContent = $('#model').classList.contains('reveal') ? 'Hide the lie' : 'Show the lie'; };
}

if (window.__PROBE) { S.name='ПРОВЕРКА ССЫЛКИ'; S.t0=Date.now(); S.mc=MC.map(q=>q.a); S.sp=SP.map(q=>q.w); S.pairsMistakes=0; S.ty=TY.map(q=>q.a); finish(); } else welcome();
</script>
</body></html>
