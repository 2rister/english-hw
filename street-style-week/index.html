<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b2aa8">
  <title>Street Style Quest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Street Style Quest home">
      <span class="brand-mark">SS</span><span>Street Style Quest</span>
    </a>
    <div class="xp-pill"><span aria-hidden="true">✦</span> <strong id="xpValue">0</strong> XP</div>
  </header>

  <main id="app" class="shell" aria-live="polite"></main>

  <template id="homeTemplate">
    <section class="hero">
      <div class="eyebrow">7-day vocabulary adventure</div>
      <h1>Build your own<br><em>style language.</em></h1>
      <p>One mission a day. About 20–25 minutes. Your progress stays on this device.</p>
      <div class="overall-card">
        <div class="progress-copy"><strong id="overallLabel">Week progress</strong><span id="overallPercent">0%</span></div>
        <div class="progress-track"><span id="overallBar"></span></div>
      </div>
    </section>
    <section>
      <div class="section-heading"><div><span class="eyebrow">Your route</span><h2>Seven missions</h2></div><button class="text-button" id="resetButton">Reset</button></div>
      <div class="day-grid" id="dayGrid"></div>
    </section>
    <section class="badge-section">
      <div class="section-heading"><div><span class="eyebrow">Mastery</span><h2>Badge cabinet</h2></div></div>
      <div class="badge-grid" id="badgeGrid"></div>
    </section>
    <section class="privacy-note"><span aria-hidden="true">🔒</span><div><strong>Private by design</strong><p>No account. No audio upload. Your answers stay in this browser.</p></div></section>
  </template>

  <template id="missionTemplate">
    <section class="mission-head">
      <button class="back-button" id="backButton">← Route</button>
      <div class="mission-number" id="missionNumber"></div>
      <h1 id="missionTitle"></h1>
      <p id="missionIntro"></p>
      <div class="mission-meta"><span id="missionTime"></span><span id="missionReward"></span></div>
      <div class="progress-track mission-progress"><span id="missionBar"></span></div>
    </section>
    <section class="game-card" id="gameCard"></section>
  </template>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
