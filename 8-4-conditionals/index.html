<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conditional Lab · Group 8.4</title>
<style>
:root{--violet:#6c3ce9;--deep:#30156f;--lav:#f4efff;--coral:#ff765d;--mint:#25b99a;--sun:#ffd166;--ink:#211735;--muted:#716987;--white:#fff;--bad:#d84c64}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#25104f,#6c3ce9 55%,#8c5cff);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}.shell{max-width:760px;margin:auto;min-height:100vh;background:#fbfaff;box-shadow:0 0 60px #16072f66}.top{position:sticky;top:0;z-index:5;padding:12px 18px;background:#30156ff2;color:#fff;backdrop-filter:blur(12px)}.topline{display:flex;justify-content:space-between;gap:12px;font-weight:800}.track{height:7px;background:#ffffff2b;border-radius:9px;margin-top:9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--sun),#ff9f69);transition:.3s}.main{padding:22px 18px 36px}.card{background:#fff;border:1px solid #e7defc;border-radius:24px;padding:22px;box-shadow:0 12px 35px #4b25851a}.eyebrow{color:var(--violet);font-weight:900;text-transform:uppercase;letter-spacing:.11em;font-size:12px}h1{font-size:clamp(30px,8vw,52px);line-height:1.02;margin:8px 0 14px;letter-spacing:-.045em}h2{font-size:28px;line-height:1.08;margin:6px 0 14px}p{margin:8px 0 14px}.hero{background:linear-gradient(145deg,#fff,#f0e9ff);border-left:7px solid var(--violet)}.rule{display:grid;gap:10px;margin:18px 0}.rule div{padding:13px 15px;border-radius:15px;background:var(--lav)}.formula{font-size:20px;font-weight:900;color:var(--deep);text-align:center;padding:17px!important;border:2px dashed #a98af5}.examples{display:grid;gap:10px}.example{padding:13px 15px;border-radius:15px;background:#eafaf6;border-left:5px solid var(--mint)}.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.name,.option{border:2px solid #e1d6fb;background:#fff;border-radius:15px;padding:13px;text-align:left;font-weight:750;cursor:pointer}.name:hover,.option:hover{border-color:var(--violet);background:var(--lav)}.name.selected{background:var(--violet);color:#fff;border-color:var(--violet)}.primary{width:100%;border:0;border-radius:16px;padding:15px 18px;background:linear-gradient(135deg,var(--violet),#8c5cff);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 8px 20px #6c3ce944}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#fff;color:var(--violet);border:2px solid var(--violet);box-shadow:none}.qnum{font-weight:900;color:var(--violet);margin-bottom:8px}.question{font-size:23px;font-weight:850;line-height:1.25;margin:8px 0 18px}.opts{display:grid;gap:10px}.option.correct{border-color:var(--mint);background:#e8faf5}.option.wrong{border-color:var(--bad);background:#fff0f3}.option:disabled{cursor:default;color:inherit}.feedback{margin-top:16px;padding:14px;border-radius:15px;font-weight:700}.feedback.good{background:#e8faf5;color:#137661}.feedback.bad{background:#fff0f3;color:#a92c45}.join{display:grid;gap:8px;margin:14px 0}.prompt{padding:12px 14px;background:var(--lav);border-radius:13px;font-weight:750}.answer{width:100%;border:2px solid #d9cef5;border-radius:14px;padding:14px;background:#fff;outline:none}.answer:focus{border-color:var(--violet)}.tag{display:inline-block;padding:5px 10px;border-radius:99px;background:var(--lav);color:var(--deep);font-size:12px;font-weight:900}.score{font-size:64px;font-weight:950;color:var(--violet);letter-spacing:-.06em}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{background:var(--lav);padding:13px;border-radius:15px}.stat b{display:block;font-size:22px;color:var(--deep)}.mission{background:linear-gradient(145deg,#281158,#6332d0);color:#fff;border:0}.mission .eyebrow{color:var(--sun)}ol{padding-left:22px}.tiny{font-size:12px;color:var(--muted)}@media(max-width:520px){.names{grid-template-columns:1fr}.card{padding:19px}.question{font-size:20px}.main{padding-inline:13px}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="topline"><span>Conditional Lab · 8.4</span><span id="progressText">Start</span></div><div class="track"><div class="fill" id="fill"></div></div></header><main class="main" id="app"></main></div>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbx9CUvXuQ827FfwviQ0JxtdBl7_K7Jg54c-O9g4EmVjGiJwlK8shWJtrz1yOXHpkd5V4g/exec';
const STUDENTS=['Пономарев Вова','Соцкий Федя','Дмитренко Иван','Егармин Слава','Савельев Андрей','Дугинец Свят'];
const zeroTheory={title:'ZERO CONDITIONAL',meaning:'Use it for facts, rules and results that are generally or always true.',form:'IF + PRESENT SIMPLE → PRESENT SIMPLE',negative:"Use don't / doesn't in either clause.",trap:"Never use will for a general fact.",examples:['If you heat ice, it melts.','A smartphone does not work if its battery is empty.']};
const firstTheory={title:'FIRST CONDITIONAL',meaning:'Use it for one real and possible future situation and its future result.',form:'IF + PRESENT SIMPLE → WILL / WON’T + BASE VERB',negative:"Use don't / doesn't after if; use won't in the result.",trap:'Never put will directly after if.',examples:['If the printer works tomorrow, we will test the new design.','If she does not charge her laptop, it will not start.']};
const zeroMC=[
['If you heat ice, it ___ .',['melts','will melt','melt'],'melts','This is a scientific fact: present + present.'],
['If inventors test a product carefully, they usually ___ problems.',['find','will find','found'],'find','This describes a general result.'],
['Food ___ warm if a fridge stops working.',['gets','will get','get'],'gets','This is generally true.'],
['If a smartphone battery is empty, the phone ___ .',["doesn't work","won't work","not work"],"doesn't work",'Use present simple in both parts.'],
['If you press this button, the printer ___ .',['starts','will start','start'],'starts','This describes how the machine normally works.'],
['A vaccine ___ people if it works correctly.',['protects','will protect','protect'],'protects','This is the general purpose of a vaccine.'],
['If designers create clear plans, builders ___ them.',['understand','will understand','understands'],'understand','Plural subject: builders understand.'],
['If you mix blue and yellow, you ___ green.',['get','will get','gets'],'get','This result is always the same.'],
['A light bulb ___ light if electricity passes through it.',['produces','will produce','produce'],'produces','A general technical fact.'],
['If researchers make a discovery, they usually ___ the information.',['share','will share','shares'],'share','A usual process: present + present.']
];
const zeroJoin=[
['you heat water to 100°C','it boils','If you heat water to 100°C, it boils.'],
['a designer tests a product','the designer finds problems','If a designer tests a product, the designer finds problems.'],
['a fridge has no electricity','food gets warm','If a fridge has no electricity, food gets warm.'],
['people do not charge a smartphone','it does not work','If people do not charge a smartphone, it does not work.'],
['a printer has no paper','it does not print documents','If a printer has no paper, it does not print documents.']
];
const firstMC=[
['If the designer finishes the plan tonight, the builder ___ tomorrow.',['will start','starts','will starts'],'will start','One possible future result: will + base verb.'],
['If we buy an electric car next year, we ___ less petrol.',['will use','use','will uses'],'will use','This is a specific future possibility.'],
['If the drone does not arrive today, I ___ the producer.',['will call','call','will called'],'will call','Use will + base verb in the result.'],
['She ___ the demonstration if her laptop works tomorrow.',['will give','gives','will gives'],'will give','Tomorrow makes this a specific future situation.'],
['If they ___ the new vaccine next month, they will publish the results.',['test','will test','tests'],'test','Use present simple after if.'],
['If my smartphone battery dies later, I ___ your tablet.',['will use','use','will used'],'will use','A possible future consequence.'],
['We will find the building if the satnav ___ correctly.',['works','will work','work'],'works','No will in the if-clause.'],
['If the inventor wins the prize, the organisation ___ the product.',['will develop','develops','will develops'],'will develop','Specific possible future result.'],
['If the printer ___ tomorrow, we will send the description by email.',['does not work','will not work','not works'],'does not work','Use does not + base verb after if.'],
['If you give a clear explanation, everyone ___ the design.',['will understand','understands','will understood'],'will understand','One future result of one possible action.']
];
const firstJoin=[
['we go on holiday next month','I buy you a present','If we go on holiday next month, I will buy you a present.'],
['they cancel the train tomorrow','we do not arrive on time','If they cancel the train tomorrow, we will not arrive on time.'],
['the drone passes the test this afternoon','the company produces it next year','If the drone passes the test this afternoon, the company will produce it next year.'],
['she does not finish the design tonight','the builder does not start tomorrow','If she does not finish the design tonight, the builder will not start tomorrow.'],
['I make an important discovery during the investigation','I share the information with you','If I make an important discovery during the investigation, I will share the information with you.']
];
const mixed=[
['choice','A light bulb ___ light if electricity passes through it.',['produces','will produce','produced'],'produces','zero','This is always true.'],
['choice','If the developer finishes the app tonight, we ___ it tomorrow.',['will test','test','will tested'],'will test','first','Tonight and tomorrow make it one future possibility.'],
['choice','If you do not put food in a fridge, it ___ fresh for long.',["doesn't stay","won't stay","not stay"],"doesn't stay",'zero','A general result.'],
['choice','If our satnav stops working on the trip tomorrow, we ___ a map.',['will use','use','will used'],'will use','first','A specific future trip.'],
['choice','A builder ___ a plan if the design is clear.',['follows','will follow','follow'],'follows','zero','This describes a normal process.'],
['choice','If the organisation approves the plan on Friday, the team ___ development.',['will begin','begins','will begins'],'will begin','first','Friday signals a future possibility.'],
['choice','If a vaccine protects people, it ___ the spread of disease.',['reduces','will reduce','reduce'],'reduces','zero','A general cause and effect.'],
['choice','If the printer arrives today, I ___ a demonstration tomorrow.',['will give','give','will gave'],'will give','first','One possible future situation.'],
['choice','If a producer likes a composition, the producer usually ___ it.',['records','will record','record'],'records','zero','Usually means a general pattern.'],
['choice','If they discover a problem during tomorrow’s test, they ___ the product.',['will improve','improve','will improved'],'will improve','first','A future test and consequence.'],
['choice','A tablet ___ on if its battery has no power.',["doesn't turn","won't turn","not turns"],"doesn't turn",'zero','A general technical fact.'],
['choice','If she makes a final decision tonight, she ___ us in the morning.',['will inform','informs','will informed'],'will inform','first','A specific possible decision.'],
['input','Complete: water / reach 100°C → boil. (reach, boil)',['If water reaches 100°C, it boils.'],'If water reaches 100°C, it boils.','zero','Present simple in both clauses.'],
['input','Complete: the designer / send the plan tonight → the builder / read it tomorrow. (send, read)',['If the designer sends the plan tonight, the builder will read it tomorrow.'],'If the designer sends the plan tonight, the builder will read it tomorrow.','first','Present after if; will + base in the result.'],
['input','Complete: people / use a satnav → it / give directions. (use, give)',['If people use a satnav, it gives directions.'],'If people use a satnav, it gives directions.','zero','A general function.'],
['input','Complete: we / finish the investigation today → we / share the conclusion tomorrow. (finish, share)',['If we finish the investigation today, we will share the conclusion tomorrow.'],'If we finish the investigation today, we will share the conclusion tomorrow.','first','A specific future result.'],
['input','Complete: a fridge / not have electricity → it / not keep food cold. (not have, not keep)',['If a fridge does not have electricity, it does not keep food cold.'],'If a fridge does not have electricity, it does not keep food cold.','zero','General negative result; present simple twice.'],
['input','Complete: the drone / not pass the test tomorrow → the company / not produce it. (not pass, not produce)',['If the drone does not pass the test tomorrow, the company will not produce it.'],'If the drone does not pass the test tomorrow, the company will not produce it.','first','Does not after if; will not in the result.'],
['input','Complete: inventors / have imagination → they / create new products. (have, create)',['If inventors have imagination, they create new products.'],'If inventors have imagination, they create new products.','zero','A general relationship.'],
['input','Complete: he / buy the electric car next week → he / test it on Friday. (buy, test)',['If he buys the electric car next week, he will test it on Friday.'],'If he buys the electric car next week, he will test it on Friday.','first','Specific future times force the first conditional.'],
['input','Complete: a printer / not have ink → it / not produce a clear page. (not have, not produce)',['If a printer does not have ink, it does not produce a clear page.'],'If a printer does not have ink, it does not produce a clear page.','zero','A general technical fact.'],
['input','Complete: the developer / complete the app tonight → we / see a demonstration tomorrow. (complete, see)',['If the developer completes the app tonight, we will see a demonstration tomorrow.'],'If the developer completes the app tonight, we will see a demonstration tomorrow.','first','One future possibility and consequence.'],
['input','Complete: people / receive clear information → they / make better decisions. (receive, make)',['If people receive clear information, they make better decisions.'],'If people receive clear information, they make better decisions.','zero','A general cause and effect.'],
['input','Complete: the tester / find a problem this afternoon → the designer / change the product. (find, change)',['If the tester finds a problem this afternoon, the designer will change the product.'],'If the tester finds a problem this afternoon, the designer will change the product.','first','A specific possible event today.']
];
const mission={title:'LEVEL UP · INVENT TOMORROW',instructions:['Choose one invention that could improve school life.','Prepare a 60–90 second oral pitch. Do not send a written text.','Use at least two zero conditionals, two first conditionals and six Unit 10 words.'],prompts:['How does the invention normally work?','What will happen if your school uses it next year?','What will happen if the first design does not work?']};
const sections=[
{id:'zmc',title:'Zero · Choose the form',intro:'10 questions · Build the zero conditional correctly.',kind:'mc',items:zeroMC},
{id:'zjoin',title:'Zero · Build the sentence',intro:'5 questions · Join the two ideas. Begin with If.',kind:'join',items:zeroJoin},
{id:'fmc',title:'First · Choose the form',intro:'10 questions · Build the first conditional correctly.',kind:'mc',items:firstMC},
{id:'fjoin',title:'First · Build the sentence',intro:'5 questions · Join the two ideas. Begin with If.',kind:'join',items:firstJoin},
{id:'mix',title:'ZERO vs FIRST · Final Challenge',intro:'24 questions · About 20 minutes. Decide: general truth or one possible future?',kind:'mixed',items:mixed}
];
const total=sections.reduce((n,s)=>n+s.items.length,0), app=document.querySelector('#app');
let state={name:'',section:0,item:0,score:0,done:0,stats:{},wrong:[],started:Date.now(),locked:false};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().replace(/[’]/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ');
function progress(){document.querySelector('#fill').style.width=(state.done/total*100)+'%';document.querySelector('#progressText').textContent=state.done?`${state.done} / ${total}`:'Start'}
function view(html){app.innerHTML=`<div class="card">${html}</div>`;scrollTo(0,0);progress()}
function welcome(){view(`<div class="eyebrow">Gateway A2 · Unit 10 · Group 8.4</div><h1>Conditional<br>Lab</h1><p>Master <b>zero</b> and <b>first conditional</b>. The final challenge is the biggest part and takes about 20 minutes.</p><p class="tiny">Choose your name. Your first answer is recorded.</p><div class="names">${STUDENTS.map(n=>`<button class="name" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div><button class="primary" id="start" disabled>Start homework</button>`);document.querySelectorAll('.name').forEach(b=>b.onclick=()=>{state.name=b.dataset.n;document.querySelectorAll('.name').forEach(x=>x.classList.toggle('selected',x===b));document.querySelector('#start').disabled=false});document.querySelector('#start').onclick=()=>{trackOpen();theory(zeroTheory,()=>startSection(0))}}
function trackOpen(){fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({version:'conditional-v1',event:'opened',unit:'u10c',group:'8.4',name:state.name})}).catch(()=>{})}
function theory(t,next){view(`<div class="eyebrow">Theory first</div><h2>${t.title}</h2><div class="rule"><div><b>Meaning</b><br>${t.meaning}</div><div class="formula">${t.form}</div><div><b>Negative</b><br>${t.negative}</div><div><b>Watch out</b><br>${t.trap}</div></div><div class="examples">${t.examples.map(x=>`<div class="example">${x}</div>`).join('')}</div><br><button class="primary" id="next">I understand — practise</button>`);document.querySelector('#next').onclick=next}
function startSection(i){state.section=i;state.item=0;const s=sections[i];view(`<div class="eyebrow">Part ${i+1} of ${sections.length}</div><h2>${s.title}</h2><p>${s.intro}</p><button class="primary" id="go">Begin</button>`);document.querySelector('#go').onclick=renderQuestion}
function current(){return sections[state.section]}
function renderQuestion(){state.locked=false;const s=current(),x=s.items[state.item];if(s.kind==='mc') return renderMC(x);if(s.kind==='join') return renderInput(x[0],x[1],x[2],s.title);if(x[0]==='choice') return renderMC([x[1],x[2],x[3],x[5]],x[4]);return renderInput(x[1],'',x[3],'ZERO or FIRST?',x[5])}
function heading(label){return `<div class="qnum">${current().title} · ${state.item+1}/${current().items.length}</div>${label?`<span class="tag">${esc(label)}</span>`:''}`}
function renderMC(x,label=''){view(`${heading(label)}<div class="question">${esc(x[0])}</div><div class="opts">${x[1].map(o=>`<button class="option" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`);document.querySelectorAll('.option').forEach(b=>b.onclick=()=>grade(b.dataset.v,x[2],x[3],b))}
function renderInput(a,b,answer,label,why='Use the conditional form shown in the theory.'){view(`${heading(label)}<div class="question">Join and complete.</div><div class="join"><div class="prompt">${esc(a)}</div>${b?`<div class="prompt">${esc(b)}</div>`:''}</div><input class="answer" id="answer" autocomplete="off" autocapitalize="sentences" placeholder="If …"><br><br><button class="primary" id="check">Check</button><div id="fb"></div>`);document.querySelector('#check').onclick=()=>grade(document.querySelector('#answer').value,answer,why)}
function grade(given,answer,why,button){if(state.locked)return;state.locked=true;const ok=norm(given)===norm(answer);state.done++;state.score+=ok?1:0;state.stats[current().id]=(state.stats[current().id]||0)+(ok?1:0);if(!ok)state.wrong.push(`${current().title} ${state.item+1}: ${given||'—'} → ${answer}`);if(button){document.querySelectorAll('.option').forEach(b=>{b.disabled=true;b.classList.toggle('correct',norm(b.dataset.v)===norm(answer));b.classList.toggle('wrong',b===button&&!ok)})}const fb=document.querySelector('#fb');fb.className=`feedback ${ok?'good':'bad'}`;fb.innerHTML=`<b>${ok?'Correct!':'Not this time.'}</b><br>${ok?esc(why):`Correct answer: <b>${esc(answer)}</b><br>${esc(why)}`}<br><br><button class="primary" id="continue">Continue</button>`;document.querySelector('#continue').onclick=advance;progress()}
function advance(){const s=current();state.item++;if(state.item<s.items.length)return renderQuestion();const next=state.section+1;if(next===2)return theory(firstTheory,()=>startSection(next));if(next<sections.length)return startSection(next);finish()}
function finish(){const pct=Math.round(state.score/total*100),mark=pct>=90?5:pct>=75?4:pct>=50?3:2;view(`<div class="eyebrow">Completed</div><h2>${esc(state.name)}</h2><div class="score">${state.score}<small> / ${total}</small></div><p><b>${pct}% · Mark ${mark}</b></p><div class="stats">${sections.map(s=>`<div class="stat">${s.title}<b>${state.stats[s.id]||0}/${s.items.length}</b></div>`).join('')}</div><button class="primary" id="send">Send to teacher</button><p class="tiny" id="status">Send once. Wait for the speaking mission.</p>`);document.querySelector('#send').onclick=()=>send(pct,mark)}
function send(pct,mark){const b=document.querySelector('#send');b.disabled=true;document.querySelector('#status').textContent='Sending…';const payload={version:'conditional-v1',unit:'u10c',group:'8.4',name:state.name,score:state.score,max:total,pct,mark,stats:state.stats,wrong:state.wrong,seconds:Math.round((Date.now()-state.started)/1000),ua:navigator.userAgent.slice(0,120)};fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(showMission).catch(showMission)}
function showMission(){app.innerHTML=`<div class="card mission"><div class="eyebrow">Result sent</div><h2>${mission.title}</h2><ol>${mission.instructions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h3>Answer these questions:</h3><ol>${mission.prompts.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p><b>Be ready to speak without reading a full script.</b></p></div>`;document.querySelector('#progressText').textContent='Done';document.querySelector('#fill').style.width='100%';scrollTo(0,0)}
welcome();
</script></body></html>
