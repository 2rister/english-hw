<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b11" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Gateway B1 Unit 1. A vocabulary mission beyond Earth." />
    <title>Orbital — Gateway B1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-stage="welcome">
    <canvas id="space" aria-hidden="true"></canvas>
    <div id="app">
      <section id="screen" aria-label="Vocabulary mission"></section>
    </div>
    <div id="hud" aria-label="Mission status" hidden>
      <div class="hud-heading">
        <span id="stage">Stage 1</span>
        <span id="progress" aria-label="Question progress"></span>
      </div>
      <div id="hearts" role="status" aria-label="Three lives remaining"></div>
      <button id="sound" class="hud-button" type="button" data-action="sound" aria-label="Toggle sound" aria-pressed="false">Sound off</button>
      <span id="connection" role="status" aria-live="polite"></span>
    </div>
    <button id="pause" class="hud-button" type="button" data-action="pause" aria-label="Pause mission" hidden>Pause</button>
    <noscript><p class="no-script">Enable JavaScript to start your mission.</p></noscript>
    <script type="module" src="./app.js?v=20261003-checkpoints"></script>
  </body>
</html>
